name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests pandas pyarrow pytest dbt-duckdb

      - name: Run unit tests
        # `python -m` puts the repo root on sys.path so `jobintel` imports
        run: python -m pytest -q

      - name: Validate dbt project
        run: dbt parse --profiles-dir .
        working-directory: dbt_project
